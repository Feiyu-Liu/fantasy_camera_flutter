appId: host.eunoia.tessercam
name: Local mock generation from Photos
env:
  E2E_EMAIL: ${E2E_EMAIL}
  E2E_PASSWORD: ${E2E_PASSWORD}
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      camera: allow
      photos: allow
      notifications: deny

- runFlow:
    when:
      visible: "不允许"
    commands:
      - tapOn: "不允许"
- assertVisible: "TesserCam"
- tapOn:
    id: "auth_email_field"
- inputText: ${E2E_EMAIL}
- tapOn:
    id: "auth_password_field"
- inputText: ${E2E_PASSWORD}
- hideKeyboard
- tapOn:
    id: "auth_password_submit"

- extendedWaitUntil:
    visible:
      id: "camera_gallery_button"
    timeout: 20000
- tapOn:
    id: "camera_gallery_button"
- extendedWaitUntil:
    visible:
      id: "generation_gallery_import_button"
    timeout: 10000
- tapOn:
    id: "generation_gallery_import_button"
- extendedWaitUntil:
    visible: "照片"
    timeout: 10000
- takeScreenshot: "01_photo_picker"
- tapOn:
    point: "16%,25%"
- extendedWaitUntil:
    visible: "等待确认"
    timeout: 20000
- takeScreenshot: "02_waiting_for_confirmation"
- tapOn: "等待确认"
- runFlow:
    when:
      visible: "不允许"
    commands:
      - tapOn: "不允许"
- runFlow:
    when:
      visible: "等待确认"
    commands:
      - tapOn: "等待确认"
- extendedWaitUntil:
    visible: "(?s)结果已保存.*"
    timeout: 90000
- takeScreenshot: "03_mock_generation_result"
